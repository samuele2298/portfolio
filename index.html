<!DOCTYPE html>
<html lang="it" data-field="htmlLang">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuele Carpani</title>
<meta name="description" content="Full stack products, end to end. Portfolio di Samuele Carpani, Full Stack Developer.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c5cf0'/%3E%3Cstop offset='100%25' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='34' height='34' rx='9' fill='url(%23g)'/%3E%3Ctext x='17' y='23' font-family='Arial, sans-serif' font-size='14' font-weight='800' fill='%230a0710' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="#top" class="logo" data-field="logo"></a>
    <nav class="main-nav">
      <!-- <a href="#services" data-field="navServices"></a> -->
      <a href="#projects" data-field="navProjects"></a>
      <a href="#skills" data-field="navSkills"></a>
      <a href="#experience" data-field="navExperience"></a>
      <a href="#formation" data-field="navFormation"></a>
      <a href="#hobbies" data-field="navHobbies"></a>
    </nav>
    <div class="lang-switch" role="group" aria-label="Lingua / Language">
      <button type="button" data-lang-btn="it">IT</button>
      <button type="button" data-lang-btn="en">EN</button>
    </div>
    <a href="#contact" class="btn btn-primary btn-small" data-field="navContact"></a>
    <button class="nav-toggle" aria-label="Apri il menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <!-- HERO -->
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-content">
        <p class="eyebrow" data-field="role"></p>
        <h1 data-field="name"></h1>
        <p class="hero-sub" data-field="tagline"></p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary" data-field="heroCtaWork"></a>
          <a href="#contact" class="btn btn-ghost" data-field="heroCtaContact"></a>
        </div>
      </div>
      <div class="hero-media">
        <div class="hero-photo">
          <img data-field="photo" alt="" onerror="this.parentElement.classList.add('photo-fallback')">
        </div>
      </div>
    </div>

    <div class="brands">
      <div class="container">
        <p class="brands-label" data-field="brandsLabel"></p>
      </div>
      <div class="brands-marquee">
        <ul class="brands-list" data-field="brands"></ul>
      </div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="section">
    <div class="container">
      <p class="eyebrow" data-field="projectsEyebrow"></p>
      <h2 data-field="projectsHeading"></h2>
      <p class="section-lead" data-field="projectsLead"></p>

      <div class="project-grid" data-field="projects"></div>
      <div class="projects-actions" data-field="projectsLoadMoreWrap">
        <button type="button" class="btn btn-ghost projects-load-more" data-field="projectsLoadMore"></button>
      </div>
    </div>
  </section>

  <!-- WHAT I BRING -->
  <section id="skills" class="section section-muted">
    <div class="container">
      <p class="eyebrow" data-field="bringEyebrow"></p>
      <h2 data-field="bringHeading"></h2>

      <div class="offerings-grid" data-field="offerings"></div>
    </div>
  </section>

  <!-- EXPERIENCE -->
  <section id="experience" class="section">
    <div class="container">
      <p class="eyebrow" data-field="experienceEyebrow"></p>
      <h2 data-field="experienceHeading"></h2>

      <ol class="timeline" data-field="experience"></ol>
    </div>
  </section>

  <!-- SERVICES (nascosta per ora)
  <section id="services" class="section section-muted">
    <div class="container">
      <p class="eyebrow" data-field="servicesEyebrow"></p>
      <h2 data-field="servicesHeading"></h2>

      <div class="service-grid" data-field="services"></div>
    </div>
  </section>
  -->

  <!-- STACK -->
  <section class="section">
    <div class="container">
      <p class="eyebrow" data-field="stackEyebrow"></p>
      <h2 data-field="stackHeading"></h2>

      <ul class="stack-grid" data-field="stack"></ul>
    </div>
  </section>

  <!-- EDUCATION -->
  <section id="formation" class="section section-muted">
    <div class="container">
      <p class="eyebrow" data-field="educationEyebrow"></p>
      <h2 data-field="educationHeading"></h2>

      <ul class="education-list" data-field="education"></ul>
    </div>
  </section>

  <!-- HOBBIES -->
  <section id="hobbies" class="section">
    <div class="container">
      <p class="eyebrow" data-field="hobbiesEyebrow"></p>
      <h2 data-field="hobbiesHeading"></h2>

      <div class="hobby-grid" data-field="hobbies"></div>

      <div class="highlight-grid" data-field="highlights"></div>
    </div>
  </section>

  <!-- TESTIMONIALS (nascosta per ora)
  <section class="section section-muted">
    <div class="container">
      <p class="eyebrow" data-field="testimonialsEyebrow"></p>
      <h2 data-field="testimonialsHeading"></h2>

      <div class="testimonial-grid" data-field="testimonials"></div>
    </div>
  </section>
  -->

  <!-- CONTACT / CTA -->
  <section id="contact" class="section cta-section">
    <div class="container cta-inner">
      <h2 data-field="contactHeading"></h2>
      <p data-field="contactLead"></p>
      <div class="cta-actions" data-field="contactActions"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span id="year"></span> <span data-field="footerName"></span>. <span data-field="footerRights"></span></p>
    <a data-field="footerLinkedin" target="_blank" rel="noopener"></a>
  </div>
</footer>

<!-- PROJECT DETAIL MODAL -->
<div class="modal-overlay" id="projectModal" aria-hidden="true">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Chiudi">&times;</button>
    <div class="modal-content">
      <p class="eyebrow" data-field="modalTag"></p>
      <h2 id="modalTitle" data-field="modalTitle"></h2>
      <p class="modal-desc" data-field="modalShortDescription"></p>
      <div class="modal-actions" data-field="modalActions"></div>

      <div class="modal-body" data-field="modalDescription"></div>

      <div data-section="modalStack">
        <h3 class="modal-subhead" data-field="modalStackHeading"></h3>
        <ul class="stack-grid" data-field="modalStack"></ul>
      </div>
    </div>
  </div>
</div>

<!-- SCREENSHOT CAROUSEL -->
<div class="carousel-overlay" id="screenCarousel" aria-hidden="true">
  <button class="modal-close carousel-close" id="carouselClose" aria-label="Chiudi">&times;</button>
  <div class="carousel-dialog">
    <button class="carousel-nav carousel-prev" id="carouselPrev" aria-label="Precedente">&#8249;</button>
    <div class="carousel-viewport">
      <img id="carouselImage" src="" alt="">
    </div>
    <button class="carousel-nav carousel-next" id="carouselNext" aria-label="Successivo">&#8250;</button>
  </div>
  <p class="carousel-counter" id="carouselCounter"></p>
</div>

<script src="assets/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
